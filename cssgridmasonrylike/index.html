<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh Masonry bằng CSS Grid</title>
    <!-- Liên kết đến file CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>Thư Viện Ảnh (Masonry Layout)</h1>
        <p>Bố cục đan xen sử dụng CSS Grid (grid-column: span & grid-row: span)</p>
    </header>

    <!-- Container thư viện ảnh -->
    <main class="gallery-container">
        <!-- 10 Ảnh với các class khác nhau để tạo bố cục đa dạng -->
        <div class="gallery-item item-large">
            <img src="https://picsum.photos/id/1015/800/800" alt="Ảnh phong cảnh">
        </div>
        <div class="gallery-item item-tall">
            <img src="https://picsum.photos/id/1016/600/1200" alt="Ảnh dọc">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/id/1018/600/600" alt="Ảnh vuông nhỏ">
        </div>
        <div class="gallery-item item-wide">
            <img src="https://picsum.photos/id/1019/1200/600" alt="Ảnh ngang rộng">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/id/1020/600/600" alt="Ảnh vuông nhỏ">
        </div>
        <div class="gallery-item item-tall">
            <img src="https://picsum.photos/id/1021/600/1200" alt="Ảnh dọc">
        </div>
        <div class="gallery-item item-wide">
            <img src="https://picsum.photos/id/1022/1200/600" alt="Ảnh ngang rộng">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/id/1023/600/600" alt="Ảnh vuông nhỏ">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/id/1024/600/600" alt="Ảnh vuông nhỏ">
        </div>
        <div class="gallery-item item-large">
            <img src="https://picsum.photos/id/1025/800/800" alt="Ảnh lớn">
        </div>
    </main>
</body>
</html>
